name: Tando Wokwi simulator

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'simulator/wokwi/**'
      - '.github/workflows/wokwi-simulator.yml'
      - 'README.md'
  push:
    branches:
      - 'feature/wokwi-dual-gc9a01'
    paths:
      - 'simulator/wokwi/**'
      - '.github/workflows/wokwi-simulator.yml'
      - 'README.md'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==11.3.0
      - name: Check circuit, firmware adapter and evidence validator
        run: python -m unittest discover -s simulator/wokwi/tests -p 'test_*.py' -v
      - name: Report runtime verification boundary
        run: echo 'Cloud runtime, extension activation and live two-eye rendering are NOT VERIFIED by this workflow. Run install.ps1 with your own Wokwi token and inspect both eyes.' >> "$GITHUB_STEP_SUMMARY"
  windows-installer:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test installer with isolated tools and repositories
        shell: ${{ matrix.shell }}
        run: '& ./simulator/wokwi/tests/test_install.ps1'
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Compile ESP32-S3 simulator firmware
        run: pio run -d simulator/wokwi
      - name: Upload compiled ESP32-S3 firmware
        uses: actions/upload-artifact@v4
        with:
          name: tando-esp32s3-firmware
          path: |
            simulator/wokwi/.pio/build/tando-s3-sim/firmware.bin
            simulator/wokwi/.pio/build/tando-s3-sim/firmware.elf
          if-no-files-found: error
  custom-chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wokwi CLI
        run: |
          curl --fail --location --retry 3 https://github.com/wokwi/wokwi-cli/releases/download/v0.29.1/wokwi-cli-linuxstatic-x64 -o wokwi-cli
          echo '3c9d6da007d008a3822ab468318037285440055132c59fd659d7306e40f14258  wokwi-cli' | sha256sum --check
          chmod +x wokwi-cli
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Lint Wokwi circuit
        working-directory: simulator/wokwi
        run: wokwi-cli lint
      - name: Compile virtual GC9A01
        working-directory: simulator/wokwi
        run: wokwi-cli chip compile gc9a01.chip.c -o gc9a01.chip.wasm
      - name: Test compiled chip colors and independent display state
        working-directory: simulator/wokwi
        run: node tests/test_chip.mjs
      - name: Upload virtual display binary
        uses: actions/upload-artifact@v4
        with:
          name: tando-gc9a01-wasm
          path: simulator/wokwi/gc9a01.chip.wasm
          if-no-files-found: error
