name: Tando Versioned Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tando-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          BRANCH="${GITHUB_REF_NAME}"
          FW_VERSION="$(sed -n 's/^#define TANDO_VERSION "\([^"]*\)".*/\1/p' tando_final_demo_15min.ino | head -n1)"

          if [[ -z "${VERSION}" ]]; then
            echo "::error::VERSION is empty."
            exit 1
          fi

          if [[ "${FW_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Firmware TANDO_VERSION (${FW_VERSION}) does not match VERSION (${VERSION})."
            exit 1
          fi

          if [[ "${BRANCH}" == "main" ]]; then
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::main requires a stable X.Y.Z version."
              exit 1
            fi
            PRERELEASE=false
          elif [[ "${BRANCH}" == "develop" ]]; then
            if [[ "${{ github.event.created }}" == "true" && ! "${VERSION}" =~ -rc\.[0-9]+$ ]]; then
              echo "develop branch bootstrap detected; no release is created for the branch-creation event."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "::error::develop requires a pre-release X.Y.Z-rc.N version."
              exit 1
            fi
            PRERELEASE=true
          else
            echo "::error::Unsupported release branch: ${BRANCH}"
            exit 1
          fi

          TAG="v${VERSION}"

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Verify tag is new
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Released versions are immutable; bump VERSION."
            exit 1
          fi

      - name: Prepare firmware release asset
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cp tando_final_demo_15min.ino "tando-${VERSION}.ino"

      - name: Create stable GitHub Release
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          gh release create "${TAG}" \
            "tando-${VERSION}.ino" \
            VERSION \
            --target "${GITHUB_SHA}" \
            --title "Tando Firmware ${TAG}" \
            --generate-notes

      - name: Create GitHub Pre-release
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          gh release create "${TAG}" \
            "tando-${VERSION}.ino" \
            VERSION \
            --target "${GITHUB_SHA}" \
            --title "Tando Firmware ${TAG}" \
            --generate-notes \
            --prerelease
