[platformio]
src_dir = ../../firmware/tando_final_demo_15min
default_envs = tando-s3-sim

[env]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi

lib_deps =
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit GC9A01A @ 1.2.0
    adafruit/Adafruit MPR121 @ 1.2.1
    adafruit/Adafruit BusIO @ 1.17.4
    miguelbalboa/MFRC522 @ 1.4.12
build_src_filter = +<*>

[env:tando-s3-sim]
build_flags = -DTANDO_WOKWI_MODE=1

[env:tando-s3-hardware]
build_flags = -DTANDO_WOKWI_MODE=0
